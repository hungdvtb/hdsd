<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Hướng dẫn sử dụng Y tế Cộng đồng</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Tài liệu hướng dẫn sử dụng ứng dụng Y tế Cộng đồng">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Theme: Simple -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #0056b3;
    }

    .markdown-section img {
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin: 20px 0;
    }

    .app-name-link img {
      width: 50px;
    }
  </style>
</head>

<body>
  <div id="app">Đang tải tài liệu...</div>
  <script>
    window.$docsify = {
      name: 'Y tế Cộng đồng',
      repo: '',
      // Tên file markdown chính của bạn
      homepage: 'Readmegit.md',
      loadSidebar: false,
      subMaxLevel: 2,
      auto2top: true,
      executeScript: true,
      search: 'auto',
      placeholder: 'Tìm kiếm...',
      noData: 'Không tìm thấy kết quả!',
      copyCode: {
        buttonText: 'Sao chép',
        errorText: 'Lỗi',
        successText: 'Đã chép'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>

</html>
